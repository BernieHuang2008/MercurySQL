name: "[CI] Driver Test"

# Tests run on `pull_request`, NOT on `pull_request_target`: the latter checks
# out the *base* branch, so a PR could never be gated on its own code while the
# badge still turned green.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

# Read-only token: a test run never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_driver_sqlite:
    name: Driver Test - SQLite (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `requires-python = ">=3.8"`, so 3.8 is the floor and the newest
        # stable is the ceiling. Python 3.8 is not available on the newest
        # Ubuntu image, so that leg pins an older runner.
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test-suite
        run: python -m pytest tests -q

      - name: Run the legacy golden-output tests
        run: |
          cd tests/drivers && python sqlite.py
          cd ../extreme && python multithread.py
