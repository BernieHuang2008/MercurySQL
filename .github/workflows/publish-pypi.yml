# Build the package and upload it to PyPI when a release is published.
#
# Publishing is gated on the test job, and it authenticates through PyPI
# Trusted Publishing (OIDC) instead of a long-lived API token:
#   PyPI -> Your project -> Publishing -> Add a new publisher
#   Owner / Repository: the repository this workflow runs in
#   Workflow: publish-pypi.yml | Environment: pypi
# Configure the publisher on PyPI before the first release, otherwise the upload
# job has no credentials.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.x"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest tests -q

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.x"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Verify the metadata and the archive contents
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import glob, tarfile, zipfile
          for path in glob.glob("dist/*"):
              if path.endswith(".whl"):
                  names = zipfile.ZipFile(path).namelist()
              else:
                  names = tarfile.open(path).getnames()
              assert any(n.endswith("MercurySQL/VERSION") for n in names), path
              print(path, "ok")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/MercurySQL
    permissions:
      id-token: write   # Trusted Publishing (OIDC)
    steps:
      - name: Download the built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29  # release/v2
