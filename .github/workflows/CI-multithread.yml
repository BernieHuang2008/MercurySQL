name: "[CI] Multi-thread Test"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_extreme_multithread:
    name: "EXTREME: Multi-thread Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.x"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Concurrent access from several threads
        # Run it three times: a race that only fails sometimes must not pass CI.
        run: |
          for i in 1 2 3; do
            (cd tests/extreme && python multithread.py)
          done

      - name: Threads must not leak
        run: python -m pytest tests -q -k "f07 or f03"
