name: Docs - Pull Request Docs Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "MercurySQL/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "MercurySQL/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Sphinx documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.x"

      - name: Install the package and the docs requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt

      # Warnings are errors: a broken reference fails the build instead of
      # silently shipping a broken page.
      - name: Build the docs
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html

      - name: Upload the built documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: Documentation HTML
          path: docs/build/html/
          if-no-files-found: error
